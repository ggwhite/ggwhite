name: Deploy blog to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "blog/**"
      - "til/**"
      - ".github/workflows/deploy-blog.yml"
  workflow_dispatch:
  # Weekly rebuild so star counts on /projects stay fresh (Mondays 00:00 UTC).
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the TIL loader falls back to a file's first commit
          # date when a note has no date line.
          fetch-depth: 0

      - name: Build with Astro
        uses: withastro/action@v6
        env:
          # Raises the GitHub API rate limit for live star counts.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path: blog
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
